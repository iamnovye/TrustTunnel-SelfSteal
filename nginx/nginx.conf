# nginx listens on port 80 (HTTP) and optionally 8443 (HTTPS).
# TrustTunnel terminates TLS on port 443 for VPN traffic.

server {
    listen 80;
    server_name _;

    # ── Decoy site (default for all visitors) ─────────────────────
    root /usr/share/nginx/decoy;
    index index.html;

    # ── Secret admin panel ────────────────────────────────────────
    location /${PANEL_PATH}/ {
        alias /usr/share/nginx/panel/;
        try_files $uri $uri/ /${PANEL_PATH}/index.html;
    }

    # ── Panel API → Flask backend ─────────────────────────────────
    location /${PANEL_PATH}/api/ {
        rewrite ^/${PANEL_PATH}/api/(.*) /api/$1 break;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Everything else → decoy ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS on port 8443 — only active when LE cert is mounted
# (set SSL_CERT / SSL_KEY env vars via docker-compose)
${NGINX_SSL_SERVER}
