# HTTPS version — DOMAIN and PANEL_PATH substituted by envsubst

server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Decoy site (default) ──────────────────────────────────────
    root /usr/share/nginx/decoy;
    index index.html;

    # ── Secret admin panel path ───────────────────────────────────
    location /${PANEL_PATH}/ {
        alias /usr/share/nginx/panel/;
        try_files $uri $uri/ /${PANEL_PATH}/index.html;
    }

    # ── Panel API ─────────────────────────────────────────────────
    location /${PANEL_PATH}/api/ {
        rewrite ^/${PANEL_PATH}/api/(.*) /api/$1 break;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Catch-all: serve decoy ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
