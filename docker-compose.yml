version: "3.9"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Admin credentials for the web panel
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-changeme}
      # Flask session secret — set a long random string in .env
      SECRET_KEY: ${SECRET_KEY}
      # TrustTunnel config paths (inside the container via volume below)
      VPN_TOML: /trusttunnel/vpn.toml
      HOSTS_TOML: /trusttunnel/hosts.toml
      CREDENTIALS_FILE: /trusttunnel/credentials
      TT_BINARY: /trusttunnel/trusttunnel_endpoint
      # Your server's public IP or domain (used in connection links)
      SERVER_ADDRESS: ${SERVER_ADDRESS}
    volumes:
      # Mount the directory where TrustTunnel is installed on the host
      - ${TRUSTTUNNEL_DIR:-/opt/trusttunnel}:/trusttunnel
    networks:
      - app

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for Let's Encrypt:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
