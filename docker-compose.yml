version: "3.9"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-changeme}
      SECRET_KEY: ${SECRET_KEY}
      VPN_TOML: /trusttunnel/vpn.toml
      HOSTS_TOML: /trusttunnel/hosts.toml
      CREDENTIALS_FILE: /trusttunnel/credentials
      TT_BINARY: /trusttunnel/trusttunnel_endpoint
      SERVER_ADDRESS: ${SERVER_ADDRESS}
    volumes:
      - ${TRUSTTUNNEL_DIR:-/opt/trusttunnel}:/trusttunnel
    networks:
      - app

  frontend:
    build: ./nginx
    restart: unless-stopped
    ports:
      # Bind only to localhost — TrustTunnel proxies here from port 443.
      # Never expose this port directly to the internet.
      - "127.0.0.1:8080:80"
    environment:
      PANEL_PATH: ${PANEL_PATH:-manage}
    volumes:
      - ./frontend/decoy:/usr/share/nginx/decoy:ro
      - ./frontend/panel:/usr/share/nginx/panel:ro
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
