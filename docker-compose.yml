version: "3.9"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-changeme}
      SECRET_KEY: ${SECRET_KEY}
      VPN_TOML: /trusttunnel/vpn.toml
      HOSTS_TOML: /trusttunnel/hosts.toml
      CREDENTIALS_FILE: ${CREDENTIALS_FILE:-/trusttunnel/credentials.toml}
      TT_BINARY: /trusttunnel/trusttunnel_endpoint
      SERVER_ADDRESS: ${SERVER_ADDRESS}
    volumes:
      - ${TRUSTTUNNEL_DIR:-/opt/trusttunnel}:/trusttunnel
    networks:
      - app

  frontend:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    environment:
      PANEL_PATH: ${PANEL_PATH:-manage}
      SSL_CERT: ${SSL_CERT:-}
      SSL_KEY: ${SSL_KEY:-}
    volumes:
      - ./frontend/decoy:/usr/share/nginx/decoy:ro
      - ./frontend/panel:/usr/share/nginx/panel:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${TRUSTTUNNEL_DIR:-/opt/trusttunnel}/certs:/trusttunnel/certs:ro
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
