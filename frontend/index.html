<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustTunnel Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #4f7cff;
      --accent-hover: #6b94ff;
      --danger: #e05252;
      --danger-hover: #f06060;
      --text: #e2e4ed;
      --muted: #7a7f99;
      --success: #52c07a;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Login ── */
    #login-page {
      width: 100%;
      max-width: 380px;
      padding: 16px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
    }

    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .logo span { color: var(--accent); }
    .logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }

    /* ── Main panel ── */
    #main-page {
      display: none;
      width: 100%;
      max-width: 700px;
      padding: 16px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .panel-header h1 { font-size: 20px; font-weight: 700; }
    .panel-header h1 span { color: var(--accent); }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--accent); }

    .field { margin-bottom: 16px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; font-size: 13px; }
    .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }

    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text); color: var(--text); }

    .btn-full { width: 100%; justify-content: center; }

    /* ── Add user section ── */
    .add-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 24px;
    }

    .add-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--text); }

    .add-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .add-form .field { flex: 1; min-width: 130px; margin-bottom: 0; }

    /* ── Users list ── */
    .users-section { }
    .users-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }

    .users-list { display: flex; flex-direction: column; gap: 10px; }

    .user-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      color: #fff;
    }

    .user-name { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .user-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn-link { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; font-size: 13px; border-radius: 7px; cursor: pointer; font-weight: 500; transition: background 0.15s; }
    .btn-link:hover { background: var(--accent); color: #fff; }

    /* ── Link modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 24px;
      max-width: 520px;
      width: 100%;
    }

    .modal h3 { font-size: 17px; margin-bottom: 16px; }
    .modal-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

    .link-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px 14px;
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
      color: var(--success);
      min-height: 60px;
    }

    .qr-wrap { margin-top: 16px; text-align: center; }
    .qr-wrap canvas { border-radius: 8px; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    /* ── Notifications ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      max-width: 320px;
      animation: slideIn 0.2s ease;
    }

    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }

    @keyframes slideIn {
      from { transform: translateX(40px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    .empty-state { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-card">
    <div class="logo">
      <h1>Trust<span>Tunnel</span></h1>
      <p>Панель администратора</p>
    </div>
    <div class="field">
      <label>Логин</label>
      <input id="l-user" type="text" placeholder="admin" autocomplete="username" />
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div id="login-err" style="color:var(--danger);font-size:13px;margin-bottom:12px;display:none;"></div>
    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">Войти</button>
  </div>
</div>

<!-- MAIN PANEL -->
<div id="main-page">
  <div class="panel-header">
    <h1>Trust<span>Tunnel</span> &mdash; Пользователи</h1>
    <button class="btn btn-ghost" onclick="doLogout()">Выйти</button>
  </div>

  <div class="add-section">
    <h2>Добавить пользователя</h2>
    <div class="add-form">
      <div class="field">
        <label>Имя пользователя</label>
        <input id="new-user" type="text" placeholder="john_doe" />
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="new-pass" type="text" placeholder="Сгенерировать или ввести" />
      </div>
      <button class="btn btn-ghost" onclick="generatePassword()" title="Сгенерировать пароль" style="margin-bottom:0">Генерировать</button>
      <button class="btn btn-primary" id="add-btn" onclick="addUser()" style="margin-bottom:0">Добавить</button>
    </div>
  </div>

  <div class="users-section">
    <h2>Все пользователи</h2>
    <div class="users-list" id="users-list">
      <div class="empty-state">Загрузка...</div>
    </div>
  </div>
</div>

<!-- LINK MODAL -->
<div class="modal-overlay" id="link-modal" style="display:none" onclick="closeModal(event)">
  <div class="modal">
    <h3 id="modal-title">Ссылка подключения</h3>
    <div class="modal-label">Скопируйте ссылку или отсканируйте QR-код в приложении TrustTunnel</div>
    <div class="link-box" id="modal-link">Загрузка...</div>
    <div class="qr-wrap" id="qr-wrap" style="display:none">
      <canvas id="qr-canvas"></canvas>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModalForce()">Закрыть</button>
      <button class="btn btn-primary" onclick="copyLink()">Скопировать</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toasts"></div>

<script>
const API = "";  // same origin via nginx proxy

async function api(method, path, body) {
  const opts = { method, credentials: "include", headers: {} };
  if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(API + path, opts);
  const json = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, data: json };
}

function toast(msg, type = "success") {
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ── Auth ──

document.getElementById("l-pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const btn = document.getElementById("login-btn");
  const err = document.getElementById("login-err");
  err.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const { ok, data } = await api("POST", "/api/login", {
    username: document.getElementById("l-user").value,
    password: document.getElementById("l-pass").value,
  });

  btn.disabled = false;
  btn.textContent = "Войти";

  if (ok) {
    document.getElementById("login-page").style.display = "none";
    document.getElementById("main-page").style.display = "block";
    document.body.style.alignItems = "flex-start";
    document.body.style.paddingTop = "40px";
    loadUsers();
  } else {
    err.textContent = data.error || "Неверный логин или пароль";
    err.style.display = "block";
  }
}

async function doLogout() {
  await api("POST", "/api/logout");
  location.reload();
}

// ── Users ──

async function loadUsers() {
  const { ok, data } = await api("GET", "/api/users");
  const list = document.getElementById("users-list");
  if (!ok) { list.innerHTML = '<div class="empty-state">Ошибка загрузки</div>'; return; }
  if (!data.users.length) { list.innerHTML = '<div class="empty-state">Нет пользователей. Добавьте первого.</div>'; return; }

  list.innerHTML = data.users.map(u => `
    <div class="user-card" id="card-${CSS.escape(u)}">
      <div class="user-avatar">${u[0].toUpperCase()}</div>
      <div class="user-name">${escHtml(u)}</div>
      <div class="user-actions">
        <button class="btn-link" onclick="showLink('${escAttr(u)}')">Ссылка</button>
        <button class="btn btn-danger" onclick="deleteUser('${escAttr(u)}')">Удалить</button>
      </div>
    </div>`).join("");
}

function generatePassword() {
  const chars = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789!@#$%";
  let p = "";
  for (let i = 0; i < 16; i++) p += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById("new-pass").value = p;
}

async function addUser() {
  const username = document.getElementById("new-user").value.trim();
  const password = document.getElementById("new-pass").value.trim();
  if (!username || !password) { toast("Введите имя и пароль", "error"); return; }

  const btn = document.getElementById("add-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  const { ok, data } = await api("POST", "/api/users", { username, password });
  btn.disabled = false;
  btn.textContent = "Добавить";

  if (!ok) { toast(data.error || "Ошибка", "error"); return; }

  toast(`Пользователь ${username} создан`);
  document.getElementById("new-user").value = "";
  document.getElementById("new-pass").value = "";
  loadUsers();

  if (data.link) showLinkModal(username, data.link);
}

async function deleteUser(username) {
  if (!confirm(`Удалить пользователя «${username}»?`)) return;
  const { ok, data } = await api("DELETE", `/api/users/${encodeURIComponent(username)}`);
  if (!ok) { toast(data.error || "Ошибка удаления", "error"); return; }
  toast(`Пользователь ${username} удалён`);
  loadUsers();
}

// ── Link modal ──

let currentLink = "";

async function showLink(username) {
  showLinkModal(username, null);
  const { ok, data } = await api("GET", `/api/users/${encodeURIComponent(username)}/link`);
  if (!ok) {
    document.getElementById("modal-link").textContent = data.error || "Не удалось получить ссылку";
    return;
  }
  updateModalLink(data.link);
}

function showLinkModal(username, link) {
  document.getElementById("modal-title").textContent = `Ссылка для ${username}`;
  document.getElementById("modal-link").textContent = link || "Загрузка...";
  document.getElementById("qr-wrap").style.display = "none";
  document.getElementById("link-modal").style.display = "flex";
  currentLink = link || "";
  if (link) renderQR(link);
}

function updateModalLink(link) {
  currentLink = link;
  document.getElementById("modal-link").textContent = link;
  renderQR(link);
}

function renderQR(text) {
  // Simple QR using a public API image (no JS library needed)
  const wrap = document.getElementById("qr-wrap");
  wrap.style.display = "block";
  wrap.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(text)}" width="200" height="200" style="border-radius:8px" alt="QR" />`;
}

function copyLink() {
  if (!currentLink) return;
  navigator.clipboard.writeText(currentLink).then(() => toast("Ссылка скопирована")).catch(() => {
    prompt("Скопируйте ссылку:", currentLink);
  });
}

function closeModal(e) { if (e.target.id === "link-modal") closeModalForce(); }
function closeModalForce() { document.getElementById("link-modal").style.display = "none"; }

// ── Utils ──

function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s) { return s.replace(/'/g,"\\'"); }

// Check session on load
(async () => {
  const { ok } = await api("GET", "/api/health");
  if (!ok) return;
  // Try to load users — if 401, stay on login
  const { status } = await api("GET", "/api/users");
  if (status !== 401) {
    document.getElementById("login-page").style.display = "none";
    document.getElementById("main-page").style.display = "block";
    document.body.style.alignItems = "flex-start";
    document.body.style.paddingTop = "40px";
    loadUsers();
  }
})();
</script>
</body>
</html>
